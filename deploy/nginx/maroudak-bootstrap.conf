# ==============================================================================
#  إعداد التمهيد — HTTP فقط، **للحصول على الشهادة الأولى ثم يُستبدل**
#
#  المشكلة التي يحلّها: الإعداد الكامل (maroudak.conf) يشير إلى ملفات شهادة
#  لا توجد قبل إصدارها، فيرفض `nginx -t` تشغيله. وإصدار الشهادة يحتاج Nginx
#  يعمل ليخدم تحدّي ACME. التمهيد يكسر هذه الحلقة:
#
#    1. هذا الملف  ← Nginx يعمل على 80 ويخدم /.well-known/acme-challenge/
#    2. certbot certonly --webroot  ← تصدر الشهادة
#    3. maroudak.conf  ← الإعداد الكامل بـHTTPS
#
#  الخطوات بالأوامر: deploy/README.md §8
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name maroody.com www.maroody.com;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503 'قيد التجهيز';
        add_header Content-Type 'text/plain; charset=utf-8' always;
    }
}
