# ==============================================================================
#  إعداد TLS — يُوضع في /etc/nginx/snippets/maroudak-tls.conf
#
#  لماذا ملفنا لا `options-ssl-nginx.conf` من certbot: ذلك الملف لا يُنشأ إلا
#  حين يُعدّل مُلحق certbot ملفات Nginx بنفسه. نحن نطلب الشهادة بـ`certonly
#  --webroot` (لا نسمح له بلمس الإعداد)، فكان `include` يشير إلى ملف غير موجود
#  ويُفشل `nginx -t`.
#
#  الإعداد: Mozilla «Intermediate» — يدعم كل متصفح حديث وأجهزة أندرويد القديمة
#  نسبياً، وهي شريحة حاضرة في السوق المستهدف.
# ==============================================================================

ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

# بلا ssl_dhparam: القائمة أعلاه ECDHE فقط، فلا تبادل DHE يحتاجه.

ssl_session_timeout 1d;
ssl_session_cache shared:MaroudakSSL:10m;
ssl_session_tickets off;
