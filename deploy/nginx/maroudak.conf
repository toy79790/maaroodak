# ==============================================================================
#  معروضي — إعداد Nginx للإنتاج
#  يُثبَّت بـ: sudo bash deploy/scripts/nginx-setup.sh full
#
#  ⚠️ __DOMAIN__ يُستبدل عند التثبيت بالنطاق المأخوذ من NEXT_PUBLIC_APP_URL في
#     ملف البيئة — مصدر واحد للنطاق، فلا يختلف ما يعلنه التطبيق عمّا يخدمه
#     Nginx (اختلافهما = حلقة تحويل). لا تنسخ هذا الملف يدوياً.
#
#  ⚠️ ترويسات الأمان (CSP · HSTS · X-Frame-Options) **يملكها التطبيق** في
#     next.config.ts. لا تُكرّرها هنا: ترويسة مكرّرة بقيمتين مختلفتين سلوكها
#     غير محدّد بين المتصفحات، وتصبح مصدر الحقيقة موضعين لا موضعاً واحداً.
# ==============================================================================

upstream maroudak_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# --- 1) HTTP: تحدٍّ ACME ثم تحويل كل شيء إلى HTTPS -----------------------------
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # يجب أن يسبق التحويل، وإلا تعذّر تجديد الشهادة.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://__DOMAIN__$request_uri;
    }
}

# --- 2) توحيد النطاق: www → الجذر ---------------------------------------------
#  يُنفَّذ هنا لا في التطبيق: تحويل عند الحافة أرخص من إيقاظ Node.
#  ولهذا يجب ضبط CANONICAL_HOST_MODE=none في البيئة، وإلا حوّل الاثنان معاً.
server {
    # `listen … http2` لا `http2 on;`: الأخير يتطلب Nginx 1.25.1+، وUbuntu 24.04
    # يشحن 1.24 فيرفض `nginx -t` الملف كله.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.__DOMAIN__;

    include /etc/nginx/snippets/maroudak-tls.conf;

    return 308 https://__DOMAIN__$request_uri;
}

# --- 3) الموقع ----------------------------------------------------------------
server {
    # `listen … http2` لا `http2 on;`: الأخير يتطلب Nginx 1.25.1+، وUbuntu 24.04
    # يشحن 1.24 فيرفض `nginx -t` الملف كله.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    include /etc/nginx/snippets/maroudak-tls.conf;

    # لا تدبيس OCSP: Let's Encrypt أوقفت خدمة OCSP (2025) وشهاداتها بلا رابط
    # مستجيب، فالتوجيه يُنتج تحذيراً في كل إعادة تحميل بلا أي أثر.

    # لا رفع ملفات في v1؛ الحد الصغير يوقف الأجسام المتضخّمة مبكراً.
    client_max_body_size 2m;
    client_body_timeout 15s;

    # إخفاء إصدار Nginx — لا يمنع هجوماً، لكنه لا يهديه معلومة مجاناً.
    server_tokens off;

    limit_conn maroudak_conn 20;

    # --- الضغط ---------------------------------------------------------------
    #  Brotli غير مثبَّت افتراضياً على Ubuntu. لتفعيله:
    #    apt install libnginx-mod-http-brotli-filter
    #  ثم أضف: brotli on; brotli_types ...;
    #  gzip يكفي: يقلّص HTML/JS/JSON بنسبة تقارب 70%.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml;

    # --- تمرير موحّد إلى التطبيق ---------------------------------------------
    #  ⚠️ X-Forwarded-For يُكتب **استبدالاً** لا إضافة.
    #  التطبيق يثق بأول قيمة فيها (lib/security/rate-limit.ts). لو استخدمنا
    #  $proxy_add_x_forwarded_for لبقيت قيمة العميل في المقدمة، فيستطيع أي
    #  زائر انتحال عنوانه بترويسة واحدة ويُبطل تحديد المعدّل كاملاً.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;          # التوليد بالذكاء الاصطناعي قد يطول
    proxy_send_timeout 120s;

    # --- أصول Next الثابتة: بصمة في الاسم، فالتخزين أبدي ---------------------
    location /_next/static/ {
        proxy_pass http://maroudak_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # --- الفحص الصحي: بلا تخزين وبلا سجل ضجيج -------------------------------
    location = /api/health {
        proxy_pass http://maroudak_app;
        access_log off;
    }

    # --- مسارات المصادقة: حدّ أضيق ------------------------------------------
    location /api/auth/ {
        limit_req zone=maroudak_auth burst=5 nodelay;
        proxy_pass http://maroudak_app;
    }

    # --- كل ما تبقّى ---------------------------------------------------------
    location / {
        limit_req zone=maroudak_general burst=30 nodelay;
        proxy_pass http://maroudak_app;
    }
}
