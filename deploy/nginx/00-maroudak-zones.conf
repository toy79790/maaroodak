# ==============================================================================
#  مناطق تحديد المعدّل — تُوضع في /etc/nginx/conf.d/
#
#  السبب في ملف منفصل: `limit_req_zone` لا يصحّ إلا داخل كتلة http، وملفات
#  conf.d تُدرَج هناك، بينما ملف الموقع في sites-available يُدرَج داخل server.
#
#  ⚠️ المفتاح `$binary_remote_addr` وليس ترويسة: عنوان الاتصال الفعلي لا
#  يمكن انتحاله، بخلاف X-Forwarded-For الذي يرسله العميل.
# ==============================================================================

# الحدّ الشامل — يحمي من الزحف والتعداد. سخيّ عمداً: التصفّح العادي لا يقترب منه.
limit_req_zone $binary_remote_addr zone=maroudak_general:10m rate=60r/m;

# المصادقة — أضيق كثيراً. التطبيق يحدّ أيضاً (5 محاولات/15 دقيقة)، وهذا
# يوقف السيل قبل أن يصل إلى Node أصلاً.
limit_req_zone $binary_remote_addr zone=maroudak_auth:10m rate=10r/m;

# حالة الاتصالات المتزامنة — يمنع فتح مئات الاتصالات من عنوان واحد.
limit_conn_zone $binary_remote_addr zone=maroudak_conn:10m;

# استجابة الرفض: 429 لا 503 — الرقم الصحيح دلالياً، وتفهمه العملاء.
limit_req_status 429;
limit_conn_status 429;
